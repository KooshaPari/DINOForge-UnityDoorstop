version: "3"

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build all targets
    cmds:
      - ./build.sh

  build:verbose:
    desc: Build with verbose logging
    cmds:
      - ./build.sh -with_logging

  build:debug:
    desc: Build debug binaries
    cmds:
      - ./build.sh -with_logging -debug

  build:verbose:debug:
    desc: Build verbose debug binaries
    cmds:
      - ./build.sh -with_logging -debug

  test:
    desc: Run C tests
    cmds:
      - gcc -std=c11 -I. -I./src tests/test_config.c src/config/common.c src/nix/config.c src/nix/util.c -o tests/test_config && ./tests/test_config

  lint:
    desc: Lint C/C++ code
    cmds:
      - echo "No C/C++ linter configured yet. Add clang-tidy/clang-format to enable."

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf build artifacts dist
